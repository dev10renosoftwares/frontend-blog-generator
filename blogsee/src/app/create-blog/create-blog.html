<button
  type="button"
  class="home-nav-btn"
  (click)="goback()"
  aria-label="Go back to home"
>
  <span class="home-nav-icon">
    <i class="fa-solid fa-arrow-left"></i>
  </span>
</button>


<form
  (ngSubmit)="generateBlog()"
  #blogForm="ngForm"
  novalidate
  class="blog-generator-card"
>

  <!-- ===================================================== -->
  <!-- HEADER -->
  <!-- ===================================================== -->

  <div class="page-header">

    <div class="header-content">

      <div class="title-section">

        <h1>
          Blog Generator
        </h1>

        <p>
          Powered by
          <span>BlogSee</span>
        </p>

      </div>


      <!-- LANGUAGE -->

      <div class="language-selector">

        <label for="language">
          Language <span>*</span>
        </label>

        <select
          id="language"
          name="language"
          [(ngModel)]="blog.language"
          #language="ngModel"
          required
          [class.invalid]="language.invalid && language.touched"
        >

          <option
            value=""
            disabled
          >
            Select language...
          </option>

          <option
            *ngFor="let languageItem of languages"
            [value]="languageItem"
          >
            {{ languageItem }}
          </option>

        </select>

        <small
          class="error"
          *ngIf="language.invalid && language.touched"
        >
          Please select a language.
        </small>

      </div>

    </div>

  </div>


  <!-- ===================================================== -->
  <!-- CATEGORY + TONE -->
  <!-- ===================================================== -->

  <div class="form-row">


    <!-- CATEGORY -->

    <div class="form-group">

      <label for="category">
        Category <span>*</span>
      </label>

      <select
        id="category"
        name="category"
        [(ngModel)]="blog.category"
        #category="ngModel"
        required
        [class.invalid]="category.invalid && category.touched"
      >

        <option
          value=""
          disabled
        >
          Select Category
        </option>

        <option
          *ngFor="let categoryItem of categories"
          [value]="categoryItem.name"
        >
          {{ categoryItem.name }}
        </option>

      </select>

      <small
        class="error"
        *ngIf="category.invalid && category.touched"
      >
        Please select a category.
      </small>

    </div>


    <!-- TONE -->

    <div class="form-group">

      <label for="tone">
        Tone
      </label>

      <select
        id="tone"
        name="tone"
        [(ngModel)]="blog.tone"
      >

        <option
          value=""
          disabled
        >
          Select Tone
        </option>

        <option
          *ngFor="let toneItem of tones"
          [value]="toneItem"
        >
          {{ toneItem }}
        </option>

      </select>

    </div>

  </div>


  <!-- ===================================================== -->
  <!-- BLOG TOPIC -->
  <!-- ===================================================== -->

  <div class="form-group full-width">

    <label for="topic">
      Blog Topic <span>*</span>
    </label>

    <input
      id="topic"
      type="text"
      name="topic"
      [(ngModel)]="blog.topic"
      #topic="ngModel"
      required
      minlength="5"
      maxlength="150"
      placeholder="e.g. Artificial Intelligence"
      [class.invalid]="topic.invalid && topic.touched"
    />

    <small
      class="error"
      *ngIf="topic.errors?.['required'] && topic.touched"
    >
      Blog topic is required.
    </small>

    <small
      class="error"
      *ngIf="topic.errors?.['minlength'] && topic.touched"
    >
      Blog topic must contain at least 5 characters.
    </small>

    <small
      class="error"
      *ngIf="topic.errors?.['maxlength'] && topic.touched"
    >
      Blog topic cannot exceed 150 characters.
    </small>

  </div>


  <!-- ===================================================== -->
  <!-- AUDIENCE + WORD COUNT -->
  <!-- ===================================================== -->

  <div class="form-row">


    <!-- AUDIENCE -->

    <div class="form-group">

      <label for="audience">
        Audience
      </label>

      <select
        id="audience"
        name="audience"
        [(ngModel)]="blog.audience"
      >

        <option
          value=""
          disabled
        >
          Select Audience
        </option>

        <option
          *ngFor="let audienceItem of audiences"
          [value]="audienceItem"
        >
          {{ audienceItem }}
        </option>

      </select>

    </div>


    <!-- WORD COUNT -->

    <div class="form-group">

      <label for="wordCount">
        Word Count <span>*</span>
      </label>

      <select
        id="wordCount"
        name="wordCount"
        [(ngModel)]="blog.wordCount"
        #wordCount="ngModel"
        required
        [class.invalid]="wordCount.invalid && wordCount.touched"
      >

        <option
          [ngValue]="null"
          disabled
        >
          Select Word Count
        </option>

        <option
          *ngFor="let count of wordCounts"
          [ngValue]="count"
        >
          {{ count }} words
        </option>

      </select>

      <small
        class="error"
        *ngIf="wordCount.invalid && wordCount.touched"
      >
        Please select a word count.
      </small>

    </div>

  </div>


  <!-- ===================================================== -->
  <!-- GENERATE -->
  <!-- ===================================================== -->

  <div class="button-container">

    <button
      type="submit"
      class="generate-btn"
      [disabled]="isGenerating"
    >

      {{
        isGenerating
          ? 'Generating...'
          : 'Generate Blog'
      }}

    </button>

  </div>


  <!-- ===================================================== -->
  <!-- MESSAGE -->
  <!-- ===================================================== -->

  <div
    class="success-message"
    *ngIf="showMessage && (successMessage || errorMessage)"
  >

    {{ successMessage || errorMessage }}

  </div>

</form>
