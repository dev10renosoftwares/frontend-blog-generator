<div class="feedback-page">

  <!-- Top Header -->
  <div class="feedback-header">

    <button class="back-btn" type="button" (click)="goBack()">
      ←
    </button>

    <div class="header-divider"></div>

    <div class="app-icon">
        <img src="https://img.icons8.com/?size=100&id=YBDWz4x7kzS0&format=png&color=000000" alt="User">
    </div>

    <span class="app-name"><h4>BLOGSEE</h4></span>

  </div>


  <!-- Main Content -->
  <div class="feedback-layout">

    <!-- Sidebar -->
    <aside class="feedback-sidebar">

      <div class="sidebar-title">
        <span>↗</span>
        <span>Previous Feedback</span>
      </div>

      <div class="feedback-history">

        <div class="history-item">
          <span>Website experience</span>
          <small>★★★★★</small>
        </div>

        <div class="history-item">
          <span>Blog generation</span>
          <small>★★★★☆</small>
        </div>

        <div class="history-item">
          <span>Dashboard UI</span>
          <small>★★★★★</small>
        </div>

      </div>

    </aside>


    <!-- Main Feedback Area -->
    <main class="feedback-main">

      <h1>Share Your Feedback</h1>

      <p class="feedback-subtitle">
        Help us improve your Blog Gen-AI experience.
      </p>


      <!-- Feedback Card -->
      <div class="feedback-card">

        <!-- Rating -->
        <div class="rating-section">

          <label>How would you rate your experience?</label>

          <div class="stars">

            <button type="button" aria-label="1 star">
              ★
            </button>

            <button type="button" aria-label="2 stars">
              ★
            </button>

            <button type="button" aria-label="3 stars">
              ★
            </button>

            <button type="button" aria-label="4 stars">
              ★
            </button>

            <button type="button" aria-label="5 stars">
              ★
            </button>

          </div>

        </div>


        <!-- Feedback -->
        <div class="feedback-input">

          <label for="feedback">
            Tell us what you think
          </label>

          <textarea
            id="feedback"
            placeholder="Write your feedback here..."
            rows="9">
          </textarea>

        </div>


        <!-- Submit -->
        <div class="submit-area">

          <button
            class="submit-btn"
            type="button">

            Submit Feedback

          </button>

        </div>

      </div>

    </main>

  </div>

</div>
